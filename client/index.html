<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app draws under the notch and the home bar, padding itself (safe areas). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242424" />
    <!-- Add to Home Screen: opens full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bullwether" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Bullwether</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Accessibility toolbar (Open-Nagish, MIT): contrast, text size, reading aids, text to speech.
         Pinned with an integrity hash; its button sits bottom-right (the sidebar's corner is the left). -->
    <script>
      window.OpenNagishConfig = {
        position: 'bottom-right',
        lang: 'en',
        statementUrl: '/accessibility',
        statementData: {
          orgName: 'Bullwether',
          orgEmail: 'legal@bullwether.com',
          lastAuditDate: '2026-10-27',
        },
      };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/open-nagish@1.1.4/dist/open-nagish.min.js"
      integrity="sha384-mdqEytyjeXTB1qM/8ZnlLkhm7CRFmqwgoeKFUEo+fB7YlEd6loXz+R3c498IYg9U"
      crossorigin="anonymous"
      defer
    ></script>
  </body>
</html>
