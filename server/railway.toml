[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"

# Railway service: Root Directory = server, Config file = server/railway.toml.
# Add a MongoDB database to the project (Railway → New → Database → MongoDB).
#
# Variables (Railway dashboard → the server service):
# NODE_ENV=production            (required — the server refuses to start on Railway otherwise)
# ADMIN_EMAIL, ADMIN_PASSWORD_HASH (npm run hash-password), JWT_SECRET (openssl rand -hex 32): the login
# API_TOKEN=<openssl rand -hex 32> (for scripts; the login and/or this one is required)
# MONGODB_URI=${{MongoDB.MONGO_URL}}/stock-invest?authSource=admin
# ACCOUNTS_SECRET_KEY            (required to add accounts: 32+ random characters. Run `openssl rand -base64 32`
#                                 in a terminal and paste its OUTPUT as the value. Set once; never change it.)
# ALPACA_OAUTH_CLIENT_ID / ALPACA_OAUTH_CLIENT_SECRET / PUBLIC_URL  (Log in with Alpaca, optional:
#                                 PUBLIC_URL = the site's address; register PUBLIC_URL/api/v1/auth/alpaca/callback in Alpaca)
# ALPACA_STREAMS_ENABLED=false   (the broker doesn't need them; Alpaca allows one stream per account)
# PAPER_TRADING_ENABLED=true     (the runner + broker trade from here)
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID  (only one server may read the bot: turn it off locally)
# OPENAI_API_KEY, SEC_USER_AGENT, ALPHAVANTAGE_API_KEY (optional, as in .env)
# Do not set PORT: Railway sets it, and the server reads it.
